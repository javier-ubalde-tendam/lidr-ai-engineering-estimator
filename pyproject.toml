[project]
name = "lidr-ai-engineering-estimator"
version = "0.1.0"
description = "AI-powered project estimation tool - Session 05 (conversational memory + attachments)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "instructor[litellm]>=1.17.0",
    "jinja2>=3.1.6",
    "litellm>=1.83.0",
    "openai>=3.3.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.20",
    "redis>=8.1.0",
    "redisvl>=0.27.2",
    "streamlit>=1.64.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "fpdf2>=2.8.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# Patrón recomendado por FastAPI: Depends()/Form()/File() en los defaults de los parámetros
# son el mecanismo de inyección de dependencias, no una llamada mutable accidental (B008)
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.File"]

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Descubrimiento explícito: con reference/ en la raíz setuptools ve varios paquetes y aborta el build
include = ["app*", "evals*"]
