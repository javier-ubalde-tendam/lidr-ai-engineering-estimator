[project]
name = "lidr-ai-engineering-estimator"
version = "0.1.0"
description = "AI-powered project estimation tool - Session 02 (CAG)"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.19.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
