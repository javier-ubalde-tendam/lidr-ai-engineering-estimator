[project]
name = "lidr-ai-engineering-estimator"
version = "0.1.0"
description = "AI-powered project estimation tool - layered architecture aligned up to Session 11 (RAG, hybrid multi-index retrieval, generation quality)"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    # Session 7 live: Contextual Retrieval chunker (prompt caching needs the native SDK)
    "anthropic>=0.40",
    "asyncpg>=0.29",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "instructor[litellm]>=1.17.0",
    "jinja2>=3.1.6",
    # Session 7 live: chunking strategies comparison (recursive / semantic splitters)
    "langchain-experimental>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "litellm>=1.83.0",
    # Sentence tokenizer of the sentence-window chunker (punkt data is fetched lazily)
    "nltk>=3.9",
    "openai>=3.3.0",
    # Session 6 offline ingestion: tabular cleaning + validation, YAML catalog, PII pseudonymization.
    # The spaCy model (es_core_news_md) is a separate wheel, not a PyPI dependency: see README/Dockerfile
    "faker>=24.0",
    "pandas>=2.2",
    "pandera>=0.20",
    "pgvector>=0.3",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "pydantic-settings>=2.15.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "redis>=8.1.0",
    "redisvl>=0.27.2",
    "sentence-transformers>=3.0",
    "spacy>=3.7",
    # Per-API-key rate limiting of the secured routers
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0",
    "streamlit>=1.64.0",
    "structlog>=26.1.0",
    "tiktoken>=0.14.0",
    # Direct dependency only so [tool.uv.sources] can route it to the CPU index on Linux
    "torch>=2.4",
    "uvicorn[standard]>=0.54.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "logfire[asyncpg,fastapi,httpx]>=6.0.1",
    "psycopg[binary]>=3.3.9",
]

# Session 10: the cross-encoder runs on CPU. On Linux (Docker image) PyPI's torch pulls several
# GB of CUDA libraries, so it comes from PyTorch's CPU-only index; Windows/macOS PyPI wheels are
# already CPU-only. https://docs.astral.sh/uv/guides/integration/pytorch/
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "fpdf2>=2.8.9",
    "fakeredis>=2.20",
    # Session 11: RAGAS generation-quality evaluation (scripts/eval_*_s11.py; paid, never run in CI)
    "ragas>=0.2",
    "datasets>=2.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Los tests de integración necesitan PostgreSQL+pgvector real: se piden con `-m integration`
addopts = "-m 'not integration'"
markers = ["integration: requiere PostgreSQL con pgvector (BD de pruebas separada)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# Patrón recomendado por FastAPI: Depends()/Form()/File() en los defaults de los parámetros
# son el mecanismo de inyección de dependencias, no una llamada mutable accidental (B008)
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.File"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# No type stubs or py.typed marker; only imported lazily inside the reranker
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Descubrimiento explícito: con reference/ en la raíz setuptools ve varios paquetes y aborta el build
include = ["app*", "evals*"]
