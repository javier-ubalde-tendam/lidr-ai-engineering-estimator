[project]
name = "lidr-ai-engineering-estimator"
version = "0.1.0"
description = "AI-powered project estimation tool - Session 05 (conversational memory + attachments)"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "instructor[litellm]>=1.17.0",
    "jinja2>=3.1.6",
    "litellm>=1.83.0",
    "openai>=3.3.0",
    "pgvector>=0.3",
    "pydantic-settings>=2.15.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.20",
    "redis>=8.1.0",
    "redisvl>=0.27.2",
    "sentence-transformers>=3.0",
    "sqlalchemy[asyncio]>=2.0",
    "streamlit>=1.64.0",
    "structlog>=26.1.0",
    "tiktoken>=0.14.0",
    # Direct dependency only so [tool.uv.sources] can route it to the CPU index on Linux
    "torch>=2.4",
    "uvicorn[standard]>=0.54.0",
]

# Session 10: the cross-encoder runs on CPU. On Linux (Docker image) PyPI's torch pulls several
# GB of CUDA libraries, so it comes from PyTorch's CPU-only index; Windows/macOS PyPI wheels are
# already CPU-only. https://docs.astral.sh/uv/guides/integration/pytorch/
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "fpdf2>=2.8.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Los tests de integración necesitan PostgreSQL+pgvector real: se piden con `-m integration`
addopts = "-m 'not integration'"
markers = ["integration: requiere PostgreSQL con pgvector (BD de pruebas separada)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# Patrón recomendado por FastAPI: Depends()/Form()/File() en los defaults de los parámetros
# son el mecanismo de inyección de dependencias, no una llamada mutable accidental (B008)
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.File"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# No type stubs or py.typed marker; only imported lazily inside the reranker
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Descubrimiento explícito: con reference/ en la raíz setuptools ve varios paquetes y aborta el build
include = ["app*", "evals*"]
