# Orquestador: cada servicio vive en su propio Compose. `include` (Compose >= 2.20) los fusiona
# en UN proyecto con una red compartida; las rutas de cada archivo incluido se resuelven desde
# su propio directorio. No se fija `name:` para seguir usando los volumenes ya existentes.
include:
  - docker/infra/docker-compose.yml
  - docker/backend/docker-compose.yml
  - docker/frontend/docker-compose.yml
